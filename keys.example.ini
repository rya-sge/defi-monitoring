# API keys and secrets for riskdep: template.
# Copy it to keys.ini and fill in the values you have:
#   cp keys.example.ini keys.ini && chmod 600 keys.ini
# keys.ini is git-ignored and must never be committed. This template is committed and carries no values.
# Every key is optional: the tool runs on keyless public providers without them (see docs/analysis/PROVIDERS.md).
# Format: INI, readable with Python's standard configparser.

[etherscan]
# Verified contract sources and ABIs (docs/analysis/NEXT_STEP.md step 3)
api_key =

[alchemy]
# Alchemy (alchemy.com, free plan): Ethereum archive reads, for the backtest at a past block (plan 2026-10-11-backtest).
# The endpoint embeds the key: https://eth-mainnet.g.alchemy.com/v2/<key>. It is sent on the request only, never
# written to a cache file or printed (sources.Fetcher keys every response by the public RPC's URL).
api_key =
alchemy_ethereum_endpoint =

[rpc]
# RPC with archive and WebSocket access (docs/analysis/NEXT_STEP.md steps 5 and 6)
url =
ws_url =

[aggregator]
# DEX aggregator, for exit quotes on any collateral (docs/analysis/NEXT_STEP.md step 2)
zerox_api_key =
oneinch_api_key =

[alerts]
# Alert delivery (docs/analysis/NEXT_STEP.md step 1): fill in the channel you use
telegram_bot_token =
telegram_chat_id =
slack_webhook_url =
discord_webhook_url =
ntfy_topic =
smtp_host =
smtp_port =
smtp_user =
smtp_password =
email_to =
