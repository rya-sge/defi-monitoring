# API keys and secrets for riskdep: template.
# Copy it to keys.ini and fill in the values you have:
#   cp keys.example.ini keys.ini && chmod 600 keys.ini
# keys.ini is git-ignored and must never be committed. This template is committed and carries no values.
# Every key is optional: the tool runs on keyless public providers without them (see PROVIDERS.md).
# Format: INI, readable with Python's standard configparser.

