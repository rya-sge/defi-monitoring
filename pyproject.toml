[project]
name = "riskdep"
version = "0.1.0"
description = "Risk tooling for DeFi positions on Ethereum, centred on Morpho"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.25",
    "numpy>=1.24",
    "networkx>=2.8",
    "eth-utils>=2.0",
    "eth-abi>=4.0",
    "eth-hash[pycryptodome]>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned explicitly: ruff 0.17 enables ~818 rules by default, so an
# extend-select would inherit a set that shifts between ruff releases.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
