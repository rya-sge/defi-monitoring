repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Prettier over web/ only: the repo root is ruff's (120 columns), web/ is
      # prettier's (100). Pinned to the version in web/pnpm-lock.yaml, and run in
      # pre-commit's own node env so the hook works without web/node_modules.
      # `exclude` mirrors web/.prettierignore, which prettier does not read from here.
      - id: prettier
        name: prettier (web/)
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        entry: prettier --write --ignore-unknown
        files: ^web/
        exclude: ^web/(pnpm-lock\.yaml|src/mocks/(graphs?|report|shock-trace|vaults|markets|books|incidents)\.json)$
